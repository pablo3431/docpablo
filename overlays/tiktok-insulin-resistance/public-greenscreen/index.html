    tl.set('.card-host[data-card-id="' + id + '"]', { visibility: 'visible', opacity: 1 }, S);
  }
  function hide(id, D, S) {
    tl.to('.card-host[data-card-id="' + id + '"]', { opacity: 0, duration: 0.35, ease: 'power1.in' }, S + D - 0.35);
    tl.set('.card-host[data-card-id="' + id + '"]', { visibility: 'hidden', opacity: 0 }, S + D);
  }

  /* ══════════════════════════════════════════════════════════════
     O01  Intestinal absorption → glucose → blood   (0.0 – 4.0 s)
     ══════════════════════════════════════════════════════════════ */
  var S1 = 0.0;
  show('o01', S1);
  /* 5 particles fall sequentially from villi tips to blood vessel (Δy ≈ 250) */
  ['#o01-g1','#o01-g2','#o01-g3','#o01-g4','#o01-g5'].forEach(function(sel, i) {
    var t = S1 + 0.3 + i * 0.44;
    tl.fromTo(sel, { opacity:0, y:0 }, { opacity:1, duration:0.28, ease:'power2.out' }, t);
    tl.to(sel, { y:270, x: (i%2===0 ? 18 : -18), duration:0.85, ease:'power2.in' }, t + 0.28);
  });
  hide('o01', 4.0, S1);

  /* ══════════════════════════════════════════════════════════════
     O02  Glucose as cell fuel   (4.5 – 7.5 s)
     ══════════════════════════════════════════════════════════════ */
  var S2 = 4.5;
  show('o02', S2);
  /* 6 glucose particles converge toward cell center (500,470), then energy flash */
  var g2targets = [
    { id:'#o02-g1', dx:0,    dy:275 },
    { id:'#o02-g2', dx:-275, dy:150 },
    { id:'#o02-g3', dx:-275, dy:-150},
    { id:'#o02-g4', dx:0,    dy:-275},
    { id:'#o02-g5', dx:275,  dy:-150},
    { id:'#o02-g6', dx:275,  dy:150 }
  ];
  g2targets.forEach(function(g, i) {
    var t = S2 + 0.2 + i * 0.18;
    tl.fromTo(g.id, { opacity:0 }, { opacity:1, duration:0.3, ease:'power2.out' }, t);
    tl.to(g.id, { x: g.dx * 0.65, y: g.dy * 0.65, opacity:0,
                  duration:0.85, ease:'power2.in' }, t + 0.3);
  });
  /* Energy flash at ~2.4 s into clip */
  var glows = ['#o02-r1','#o02-r2','#o02-r3','#o02-r4','#o02-r5','#o02-r6','#o02-r7','#o02-r8'];
  glows.forEach(function(r) {
    tl.fromTo(r, { opacity:0 }, { opacity:1, duration:0.18 }, S2 + 2.3);
    tl.to(r, { opacity:0, duration:0.4 }, S2 + 2.5);
  });
  hide('o02', 3.0, S2);

  /* ══════════════════════════════════════════════════════════════
     O03  Closed channel — glucose waiting   (8.0 – 11.5 s)
     ══════════════════════════════════════════════════════════════ */
  var S3 = 8.0;
  show('o03', S3);
  /* Glucose particles appear and gently pulse (scale) waiting to enter */
  ['#o03-g1','#o03-g2','#o03-g3','#o03-g4','#o03-g5'].forEach(function(sel, i) {
    tl.fromTo(sel, { opacity:0, scale:0.5, transformOrigin:'center center' },
              { opacity:1, scale:1, duration:0.35, ease:'back.out(1.5)' }, S3 + 0.2 + i * 0.22);
  });
  /* Pulse (scale breathe) to show "waiting" */
  ['#o03-g1','#o03-g2','#o03-g3','#o03-g4','#o03-g5'].forEach(function(sel) {
    tl.to(sel, { scale:1.2, transformOrigin:'center center', duration:0.5, ease:'power1.inOut' }, S3 + 1.8);
    tl.to(sel, { scale:1.0, duration:0.5, ease:'power1.inOut' }, S3 + 2.3);
    tl.to(sel, { scale:1.15, duration:0.4, ease:'power1.inOut' }, S3 + 2.8);
    tl.to(sel, { scale:1.0, duration:0.4, ease:'power1.inOut' }, S3 + 3.2);
  });
  hide('o03', 3.5, S3);

  /* ══════════════════════════════════════════════════════════════
     O04  Insulin key opens channel — glucose flows in   (12.0 – 16.5 s)
     ══════════════════════════════════════════════════════════════ */
  var S4 = 12.0;
  show('o04', S4);
  /* Key descends from y=220 to receptor (shaft tip lands at ~y=415) — Δy = 195 */
  tl.to('#o04-key', { y: 195, duration: 1.2, ease: 'power2.inOut' }, S4 + 0.4);
  /* Small "click" bounce at impact */
  tl.to('#o04-key', { y: 188, duration: 0.12, ease: 'power2.out' }, S4 + 1.6);
  tl.to('#o04-key', { y: 195, duration: 0.18, ease: 'bounce.out' }, S4 + 1.72);
  /* Lock fades out, open-glow fades in */
  tl.to('#o04-lock',        { opacity: 0, scale: 0.8, transformOrigin: '500px 449px', duration: 0.42, ease: 'power2.in' }, S4 + 1.9);
  tl.to('#o04-open-glow',   { opacity: 0.55, duration: 0.38, ease: 'power2.out' },  S4 + 2.0);
  /* Glucose particles flow through channel (rightward and down) */
  tl.to('#o04-g1', { x: 220, y: 110, opacity: 0, duration: 0.9, ease: 'power2.in' }, S4 + 2.4);
  tl.to('#o04-g2', { x: 200, y: 80,  opacity: 0, duration: 0.9, ease: 'power2.in' }, S4 + 2.7);
  tl.to('#o04-g3', { x: 240, y: 150, opacity: 0, duration: 0.9, ease: 'power2.in' }, S4 + 3.0);
  hide('o04', 4.5, S4);

  /* ══════════════════════════════════════════════════════════════
     O05  Pancreas secreting insulin keys   (17.0 – 20.5 s)
     ══════════════════════════════════════════════════════════════ */
  var S5 = 17.0;
  show('o05', S5);
  /* Pancreas pulse ring expands */
  [0.3, 1.4, 2.5].forEach(function(t) {
    tl.fromTo('#o05-pulse', { opacity:0.7, scaleX:1, scaleY:1, transformOrigin:'400px 460px' },
              { opacity:0, scaleX:1.6, scaleY:1.6, duration:0.9, ease:'power1.out' }, S5 + t);
  });
  /* Wave 1 keys: appear and drift right */
  var w1 = ['#o05-k1a','#o05-k1b','#o05-k1c'];
  w1.forEach(function(k, i) {
    tl.fromTo(k, { opacity:0, x:0 }, { opacity:1, duration:0.3, ease:'power2.out' }, S5 + 0.3 + i * 0.2);
    tl.to(k, { x:80, opacity:0, duration:0.7, ease:'power1.in' }, S5 + 0.65 + i * 0.2);
  });
  /* Wave 2 keys: appear and drift right */
  var w2 = ['#o05-k2a','#o05-k2b','#o05-k2c'];
  w2.forEach(function(k, i) {
    tl.fromTo(k, { opacity:0, x:0 }, { opacity:1, duration:0.3, ease:'power2.out' }, S5 + 1.4 + i * 0.2);
    tl.to(k, { x:90, opacity:0, duration:0.7, ease:'power1.in' }, S5 + 1.75 + i * 0.2);
  });
  /* Wave 3 keys */
  var w3 = ['#o05-k3a','#o05-k3b'];
  w3.forEach(function(k, i) {
    tl.fromTo(k, { opacity:0, x:0 }, { opacity:1, duration:0.3, ease:'power2.out' }, S5 + 2.5 + i * 0.2);
    tl.to(k, { x:75, opacity:0, duration:0.6, ease:'power1.in' }, S5 + 2.85 + i * 0.2);
  });
  hide('o05', 3.5, S5);

  /* ══════════════════════════════════════════════════════════════
     O06  Normal balance — scale reaches equilibrium   (21.0 – 25.0 s)
     ══════════════════════════════════════════════════════════════ */
  var S6 = 21.0;
  show('o06', S6);
  /* Beam starts tilted (glucose side heavier), rocks to balance */
  tl.fromTo('#o06-beam', { rotation:-10, transformOrigin:'500px 665px' },
            { rotation: 0, duration:1.6, ease:'elastic.out(1, 0.4)' }, S6 + 0.5);
  /* Gentle oscillation around zero */
  tl.to('#o06-beam', { rotation:2,  transformOrigin:'500px 665px', duration:0.7, ease:'power1.inOut' }, S6 + 2.4);
  tl.to('#o06-beam', { rotation:-1, transformOrigin:'500px 665px', duration:0.6, ease:'power1.inOut' }, S6 + 3.1);
  tl.to('#o06-beam', { rotation:0,  transformOrigin:'500px 665px', duration:0.5, ease:'power1.inOut' }, S6 + 3.7);
  /* Checkmark fades in to confirm equilibrium */
  tl.fromTo('#o06-check', { opacity:0, scale:0.7, transformOrigin:'500px 805px' },
            { opacity:1, scale:1, duration:0.5, ease:'back.out(2)' }, S6 + 2.1);
  hide('o06', 4.0, S6);

  /* ══════════════════════════════════════════════════════════════
     O07  Excess glucose accumulating   (25.5 – 29.0 s)
     ══════════════════════════════════════════════════════════════ */
  var S7 = 25.5;
  show('o07', S7);
  /* Background vessel fills with red tint */
  tl.to('#o07-bg', { fill:'#FECACA', duration:2.5, ease:'power1.in' }, S7 + 0.5);
  /* Wave of new particles appearing in sequence */
  var o7wave1 = ['#o07-a1','#o07-a2','#o07-a3','#o07-a4'];
  o7wave1.forEach(function(sel, i) {
    tl.fromTo(sel, { opacity:0, scale:0.6, transformOrigin:'center center' },
              { opacity:1, scale:1, duration:0.4, ease:'back.out(1.5)' }, S7 + 0.4 + i * 0.4);
  });
  /* Red/intense particles — denser crowd */
  var o7wave2 = ['#o07-a5','#o07-a6','#o07-a7'];
  o7wave2.forEach(function(sel, i) {
    tl.fromTo(sel, { opacity:0, scale:0.5, transformOrigin:'center center' },
              { opacity:1, scale:1, duration:0.4, ease:'back.out(2)' }, S7 + 1.8 + i * 0.35);
  });
  /* Alarm ring pulses */
  tl.fromTo('#o07-warn', { opacity:0, scale:0.5, transformOrigin:'500px 450px' },
            { opacity:0.5, scale:1, duration:0.6, ease:'power2.out' }, S7 + 2.6);
  tl.to('#o07-warn', { opacity:0, scale:1.3, duration:0.6, ease:'power1.in' }, S7 + 3.0);
  hide('o07', 3.5, S7);

  /* ══════════════════════════════════════════════════════════════
     O08  Hyperinsulinemia — flood of keys   (29.5 – 34.0 s)
     ══════════════════════════════════════════════════════════════ */
  var S8 = 29.5;
  show('o08', S8);
  /* Pancreas pulse rings (3 rapid pulses) */
  [0.3, 1.2, 2.1, 3.0].forEach(function(t) {
    tl.fromTo('#o08-pulse', { opacity:0.8, scaleX:1, scaleY:1, transformOrigin:'350px 450px' },
              { opacity:0, scaleX:1.8, scaleY:1.8, duration:0.75, ease:'power1.out' }, S8 + t);
  });
  /* Pancreas slightly grows */
  tl.to('#o08-panc', { scaleX:1.1, scaleY:1.1, transformOrigin:'350px 450px', duration:1.0, ease:'power2.out' }, S8 + 0.2);
  /* Keys flood out in 4 waves, each further and more keys */
  var allWaveKeys = [
    { keys:['#o08-k1a','#o08-k1b','#o08-k1c'], t:0.3, dx:50,  dy:0   },
    { keys:['#o08-k2a','#o08-k2b','#o08-k2c'], t:1.1, dx:90,  dy:0   },
    { keys:['#o08-k3a','#o08-k3b','#o08-k3c'], t:1.9, dx:130, dy:0   },
    { keys:['#o08-k4a','#o08-k4b','#o08-k4c'], t:2.8, dx:0,   dy:-90 }
  ];
  allWaveKeys.forEach(function(wave) {
    wave.keys.forEach(function(k, i) {
      tl.fromTo(k, { opacity:0 }, { opacity:1, duration:0.28, ease:'power2.out' }, S8 + wave.t + i * 0.15);
      tl.to(k, { x: wave.dx + (i - 1) * 25, y: wave.dy + (i - 1) * 25, opacity:0,
                 duration:0.9, ease:'power1.in' }, S8 + wave.t + 0.3 + i * 0.15);
    });
  });
  hide('o08', 4.5, S8);

  /* ══════════════════════════════════════════════════════════════
     O09  Negative effects — 3 sequential icons   (34.5 – 39.5 s)
     Phase 1: Inflammation (0 – 1.8 s)
     Phase 2: Storage padlock (1.8 – 3.4 s)
     Phase 3: Triglyceride droplets (3.4 – 5.0 s)
     ══════════════════════════════════════════════════════════════ */
  var S9 = 34.5;
  show('o09', S9);
  /* Phase 1 — flame appears, heat waves pulse */
  tl.fromTo('#o09-inflam', { opacity:0, scale:0.6, transformOrigin:'500px 550px' },
            { opacity:1, scale:1, duration:0.55, ease:'back.out(1.3)' }, S9 + 0.2);
  tl.fromTo('#o09-hw1', { opacity:0.7, scaleX:1, scaleY:1, transformOrigin:'500px 450px' },
            { opacity:0, scaleX:1.5, scaleY:1.5, duration:0.7, ease:'power1.out' }, S9 + 0.5);
  tl.fromTo('#o09-hw2', { opacity:0.5, scaleX:1, scaleY:1, transformOrigin:'500px 450px' },
            { opacity:0, scaleX:1.6, scaleY:1.6, duration:0.8, ease:'power1.out' }, S9 + 0.9);
  tl.fromTo('#o09-hw1', { opacity:0.6, scaleX:1, scaleY:1, transformOrigin:'500px 450px' },
            { opacity:0, scaleX:1.5, scaleY:1.5, duration:0.7, ease:'power1.out' }, S9 + 1.3);
  tl.to('#o09-inflam', { opacity:0, scale:0.85, transformOrigin:'500px 550px', duration:0.4, ease:'power2.in' }, S9 + 1.65);
  /* Phase 2 — padlock appears */
  tl.fromTo('#o09-lock', { opacity:0, scale:0.5, transformOrigin:'500px 590px' },
            { opacity:1, scale:1, duration:0.55, ease:'back.out(1.5)' }, S9 + 2.0);
  tl.to('#o09-lock', { opacity:0, scale:0.85, transformOrigin:'500px 590px', duration:0.4, ease:'power2.in' }, S9 + 3.1);
  /* Phase 3 — fat droplets appear */
  tl.fromTo('#o09-fat', { opacity:0, scale:0.6, transformOrigin:'500px 550px' },
            { opacity:1, scale:1, duration:0.6, ease:'back.out(1.3)' }, S9 + 3.5);
  hide('o09', 5.0, S9);

  /* ══════════════════════════════════════════════════════════════
     O10  Channel malfunction — key fails to open   (40.0 – 44.0 s)
     ══════════════════════════════════════════════════════════════ */
  var S10 = 40.0;
  show('o10', S10);
  /* Key descends partially, stops short of engaging */
  tl.to('#o10-key', { y:160, duration:0.9, ease:'power2.inOut' }, S10 + 0.4);
  /* Key wobbles (rotation back and forth — signal is "torpe") */
  tl.to('#o10-key', { rotation: 12, transformOrigin:'500px 280px', duration:0.22, ease:'power2.inOut' }, S10 + 1.4);
  tl.to('#o10-key', { rotation:-12, transformOrigin:'500px 280px', duration:0.22, ease:'power2.inOut' }, S10 + 1.62);
  tl.to('#o10-key', { rotation: 8,  transformOrigin:'500px 280px', duration:0.2,  ease:'power2.inOut' }, S10 + 1.84);
  tl.to('#o10-key', { rotation:-8,  transformOrigin:'500px 280px', duration:0.2,  ease:'power2.inOut' }, S10 + 2.04);
  tl.to('#o10-key', { rotation: 0,  transformOrigin:'500px 280px', duration:0.3,  ease:'power2.out'   }, S10 + 2.24);
  /* Key retreats slightly (fails to engage) */
  tl.to('#o10-key', { y:120, duration:0.5, ease:'power2.out' }, S10 + 2.6);
  /* X indicator briefly flashes on channel */
  tl.fromTo('#o10-x', { opacity:0 }, { opacity:1, duration:0.25 }, S10 + 2.6);
  tl.to('#o10-x', { opacity:0, duration:0.35 }, S10 + 3.0);
  tl.fromTo('#o10-block', { opacity:0 }, { opacity:0.4, duration:0.3 }, S10 + 2.6);
  tl.to('#o10-block', { opacity:0, duration:0.4 }, S10 + 3.0);
  /* Second attempt — wobble again */
  tl.to('#o10-key', { y:160, duration:0.7, ease:'power2.inOut' }, S10 + 3.1);
  tl.to('#o10-key', { rotation: 10, transformOrigin:'500px 280px', duration:0.2 }, S10 + 3.8);
  tl.to('#o10-key', { rotation:-10, transformOrigin:'500px 280px', duration:0.2 }, S10 + 4.0);
  hide('o10', 4.0, S10);

  /* ══════════════════════════════════════════════════════════════
     O11  Insulin resistance — full blockade   (44.5 – 49.0 s)
     ══════════════════════════════════════════════════════════════ */
  var S11 = 44.5;
  show('o11', S11);
  /* X on channel appears with scale-in */
  tl.fromTo('#o11-x', { scale:0, transformOrigin:'500px 450px' },
            { scale:1, duration:0.55, ease:'back.out(2)' }, S11 + 0.3);
  /* Key descends toward channel, hits barrier and bounces back */
  tl.to('#o11-key', { y:195, duration:0.9, ease:'power2.inOut' }, S11 + 0.6);
  tl.to('#o11-key', { y:120, duration:0.5, ease:'power2.out'   }, S11 + 1.5);
  /* Second bounce */
  tl.to('#o11-key', { y:175, duration:0.6, ease:'power2.inOut' }, S11 + 2.1);
  tl.to('#o11-key', { y:100, duration:0.5, ease:'power2.out'   }, S11 + 2.7);
  /* Additional glucose particles overflow (appear) */
  tl.fromTo('#o11-a1', { opacity:0, scale:0.6, transformOrigin:'640px 350px' },
            { opacity:1, scale:1, duration:0.35, ease:'back.out(1.5)' }, S11 + 1.2);
  tl.fromTo('#o11-a2', { opacity:0, scale:0.6, transformOrigin:'700px 300px' },
            { opacity:1, scale:1, duration:0.35, ease:'back.out(1.5)' }, S11 + 1.6);
  tl.fromTo('#o11-a3', { opacity:0, scale:0.6, transformOrigin:'750px 360px' },
            { opacity:1, scale:1, duration:0.35, ease:'back.out(1.5)' }, S11 + 2.0);
  /* Alarm ring pulses twice */
  tl.fromTo('#o11-alarm', { opacity:0, scale:0.6, transformOrigin:'500px 450px' },
            { opacity:0.55, scale:1, duration:0.55, ease:'power2.out' }, S11 + 1.8);
  tl.to('#o11-alarm', { opacity:0, scale:1.3, duration:0.6, ease:'power1.in' }, S11 + 2.35);
  tl.fromTo('#o11-alarm', { opacity:0, scale:0.7, transformOrigin:'500px 450px' },
            { opacity:0.45, scale:1, duration:0.5, ease:'power2.out' }, S11 + 3.2);
  tl.to('#o11-alarm', { opacity:0, scale:1.25, duration:0.55, ease:'power1.in' }, S11 + 3.7);
  hide('o11', 4.5, S11);

  window.__timelines = window.__timelines || {};
  window.__timelines['docpablo-insulin-resistance-gs'] = tl;
}());
</script>
