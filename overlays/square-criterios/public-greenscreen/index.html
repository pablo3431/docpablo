<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-400-latin.woff2') format('woff2');
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-700-latin.woff2') format('woff2');
      font-weight: 700;
      font-display: block;
    }

    :root {
      --green:    #4DB89A;
      --green-bg: #EAF7F2;
      --dark:     #1B1B1B;
      --muted:    #6B7280;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #FF00FF;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }

    .card-host {
      position: absolute;
      pointer-events: none;
      overflow: visible;
    }

    /* ── Card shell ───────────────────────────────────── */
    /* Three zones: badge / hero / footer distributed evenly */
    .card-inner {
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      border-radius: 28px;
      box-shadow: 0 14px 64px rgba(0,0,0,0.20), 0 2px 8px rgba(0,0,0,0.08);
      padding: 52px 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
    }

    /* ── Zone 1: Kicker badge ─────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      background: var(--green);
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 11px 26px;
      border-radius: 100px;
      align-self: flex-start;
      white-space: nowrap;
      opacity: 0;
    }

    /* ── Zone 2: Hero block (number + unit) ───────────── */
    /* Animated as a unit: starts invisible, slides up */
    .hero-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
      opacity: 0;
    }

    /* Main range number – fills ~80 % of card width */
    .stat-big {
      font-size: 196px;
      font-weight: 900;
      color: var(--dark);
      line-height: 0.92;
      letter-spacing: -0.04em;
    }

    /* Unit label sits immediately below the number */
    .stat-unit {
      font-size: 60px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.01em;
      line-height: 1.0;
    }

    /* ── Zone 3: Footer (accent bar + context) ────────── */
    .footer-block {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Animated green bar – width expands via GSAP */
    .bar {
      display: block;
      height: 6px;
      background: var(--green);
      border-radius: 3px;
      width: 0;
    }

    /* Subtitle / explanatory text (cards 2 & 3) */
    .sub {
      font-size: 38px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.35;
      opacity: 0;
    }

    /* Reference range row (card 1 only) */
    .ref-row {
      display: flex;
      gap: 20px;
      opacity: 0;
    }
    .ref-pill {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: var(--green-bg);
      border: 2px solid var(--green);
      border-radius: 14px;
      padding: 14px 26px;
    }
    .ref-label {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--green);
    }
    .ref-value {
      font-size: 36px;
      font-weight: 800;
      color: var(--dark);
      line-height: 1.2;
    }
  </style>
</head>
<body>
<div
  id="stage"
  data-composition-id="docpablo-criterios-sq"
  data-start="0"
  data-duration="14"
  data-fps="30"
  data-width="1080"
  data-height="1080"
  style="position:relative;width:1080px;height:1080px;overflow:hidden;background:#FF00FF;"
>

  <!-- ── CRITERIO 1  Glucosa en ayuno  [0.5 – 4.5s] ── -->
  <div class="card-host clip" data-card-id="sq01" data-start="0.5" data-duration="4.0" data-track-index="2"
       style="left:40px;top:40px;width:1000px;height:1000px;visibility:hidden;opacity:0;">
    <div class="card-inner">

      <div class="badge" id="s01-badge">Criterio 1 de 3 · Glucosa en Ayuno</div>

      <div class="hero-block" id="s01-hero">
        <div class="stat-big"><span id="s01-lo">0</span>–<span id="s01-hi">0</span></div>
        <div class="stat-unit">mg/dL</div>
      </div>

      <div class="footer-block">
        <span class="bar" id="s01-bar"></span>
        <div class="ref-row" id="s01-ref">
          <div class="ref-pill">
            <span class="ref-label">Normal</span>
            <span class="ref-value">menos de 100</span>
          </div>
          <div class="ref-pill">
            <span class="ref-label">Diabetes</span>
            <span class="ref-value">126 o más</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ── CRITERIO 2  A1c  [5.0 – 9.0s] ── -->
  <div class="card-host clip" data-card-id="sq02" data-start="5.0" data-duration="4.0" data-track-index="2"
       style="left:40px;top:40px;width:1000px;height:1000px;visibility:hidden;opacity:0;">
    <div class="card-inner">

      <div class="badge" id="s02-badge">Criterio 2 de 3 · Hemoglobina Glucosilada (A1c)</div>

      <div class="hero-block" id="s02-hero">
        <div class="stat-big"><span id="s02-lo">0.0</span>–<span id="s02-hi">0.0</span></div>
        <div class="stat-unit">%</div>
      </div>

      <div class="footer-block">
        <span class="bar" id="s02-bar"></span>
        <div class="sub" id="s02-sub">Promedio de glucosa<br>de los últimos 3 meses</div>
      </div>

    </div>
  </div>

  <!-- ── CRITERIO 3  Intolerancia  [9.5 – 13.5s] ── -->
  <div class="card-host clip" data-card-id="sq03" data-start="9.5" data-duration="4.0" data-track-index="2"
       style="left:40px;top:40px;width:1000px;height:1000px;visibility:hidden;opacity:0;">
    <div class="card-inner">

      <div class="badge" id="s03-badge">Criterio 3 de 3 · Intolerancia a la Glucosa</div>

      <div class="hero-block" id="s03-hero">
        <div class="stat-big"><span id="s03-lo">0</span>–<span id="s03-hi">0</span></div>
        <div class="stat-unit">mg/dL</div>
      </div>

      <div class="footer-block">
        <span class="bar" id="s03-bar"></span>
        <div class="sub" id="s03-sub">2 horas después de carga<br>oral de glucosa (75 g)</div>
      </div>

    </div>
  </div>

  <script src="vendor/gsap.min.js"></script>
  <script>
    (function () {
      var tl = window.gsap.timeline({ paused: true });

      /*
       * card() — animates one criteria card
       *
       * Sequence (S = card start time):
       *   S+0.00  card slides up & fades in
       *   S+0.20  badge pops in (scale + fade)
       *   S+0.38  hero block (number + unit) slides up & fades in
       *   S+0.38  numbers count up from 0 to target (runs 0.72 s)
       *   S+0.64  green bar expands full width
       *   S+0.90  reference row / subtitle fades in
       *   S+3.62  card fades out & slides up (exit)
       */
      function card(id, badgeId, heroId, loId, hiId, loVal, hiVal, decimals, barId, extraId, S) {

        /* ── enter ── */
        tl.set('.card-host[data-card-id="' + id + '"]', { visibility: 'visible' }, S);
        tl.fromTo('.card-host[data-card-id="' + id + '"]',
          { opacity: 0, y: 60 },
          { opacity: 1, y: 0, duration: 0.46, ease: 'power3.out' }, S);

        /* ── badge ── */
        tl.fromTo('#' + badgeId,
          { opacity: 0, scale: 0.82 },
          { opacity: 1, scale: 1, duration: 0.30, ease: 'back.out(1.5)' }, S + 0.20);

        /* ── hero block (slides up as one piece) ── */
        tl.fromTo('#' + heroId,
          { opacity: 0, y: 32 },
          { opacity: 1, y: 0, duration: 0.46, ease: 'power2.out' }, S + 0.38);

        /* ── count-up animation on the range numbers ── */
        var fmt = decimals
          ? function (v) { return v.toFixed(decimals); }
          : function (v) { return Math.round(v) + ''; };
        var loEl = document.getElementById(loId);
        var hiEl = document.getElementById(hiId);
        var ctr = { lo: 0, hi: 0 };
        tl.to(ctr, {
          lo: loVal, hi: hiVal,
          duration: 0.72, ease: 'power2.out',
          onUpdate: function () {
            loEl.textContent = fmt(ctr.lo);
            hiEl.textContent = fmt(ctr.hi);
          }
        }, S + 0.38);

        /* ── accent bar expands ── */
        tl.fromTo('#' + barId,
          { width: 0 },
          { width: 880, duration: 0.52, ease: 'power2.out' }, S + 0.64);

        /* ── reference row or subtitle ── */
        tl.fromTo('#' + extraId,
          { opacity: 0 },
          { opacity: 1, duration: 0.38, ease: 'power2.out' }, S + 0.90);

        /* ── exit ── */
        tl.to('.card-host[data-card-id="' + id + '"]',
          { opacity: 0, y: -28, duration: 0.38, ease: 'power2.in' }, S + 3.62);
        tl.set('.card-host[data-card-id="' + id + '"]', { visibility: 'hidden' }, S + 4.0);
      }

      card('sq01', 's01-badge', 's01-hero', 's01-lo', 's01-hi', 100, 125, 0, 's01-bar', 's01-ref', 0.5);
      card('sq02', 's02-badge', 's02-hero', 's02-lo', 's02-hi', 5.7, 6.4, 1, 's02-bar', 's02-sub', 5.0);
      card('sq03', 's03-badge', 's03-hero', 's03-lo', 's03-hi', 140, 199, 0, 's03-bar', 's03-sub', 9.5);

      window.__timelines = window.__timelines || {};
      window.__timelines['docpablo-criterios-sq'] = tl;
    }());
  </script>
</div>
</body>
</html>
